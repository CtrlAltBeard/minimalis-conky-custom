conky.config = {
    alignment = 'top_right',
    background = true,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    color1 = '#ffffff',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'Roboto Mono:size=10',
    gap_x = 10,
    gap_y = 20,
    minimum_width = 320,
    minimum_height = 1000,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_type = 'desktop',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager,below',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    text_buffer_size = 4096,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
}

conky.text = [[
${alignr}${color1}${font ConkySymbols:size=15}t${font Roboto Mono:size=10} GNU/Linux
${alignr}${color1}OS${color} ${exec lsb_release -ds | cut -d' ' -f1-2}
${alignr}${color1}Kernel${color} $kernel
${alignr}${color1}Machine${color} $machine
${alignr}${color1}Uptime${color} $uptime_short
${if_existing /sys/class/power_supply/BATX}${alignr}────────────────────────────
${alignr}${color1}${font ConkySymbols:size=15}b${font Roboto Mono:size=10} Battery
${alignr}${battery_percent BATX}% ${battery_bar 10,100 BATX}
${endif}${alignr}────────────────────────────
${alignr}${color1}${font ConkySymbols:size=20}f${font Roboto Mono:size=10} System
${alignr}${color1}Core 1${color} ${freq_g 1}GHz ${cpu cpu0}% ${cpubar cpu0 4,80}
${alignr}${color1}Core 2${color} ${freq_g 2}GHz ${cpu cpu1}% ${cpubar cpu1 4,80}
${alignr}${color1}Core 3${color} ${freq_g 3}GHz ${cpu cpu2}% ${cpubar cpu2 4,80}
${alignr}${color1}Core 4${color} ${freq_g 4}GHz ${cpu cpu3}% ${cpubar cpu3 4,80}
${alignr}────────────────────────────
${alignr}${color1}${font ConkySymbols:size=15}m${font Roboto Mono:size=10} Total CPU${color} ${cpubar cpu 4,80} ${cpu}%
${alignr}${color1}Load${color} ${loadavg}
${alignr}────────────────────────────
${alignr}${color1}${font ConkySymbols:size=20}h${font Roboto Mono:size=10} Temperature
${alignr}${color1}CPU${color} ${exec sensors | grep 'Core 0' | awk '{print $3}'} ${color1}GPU${color} ${exec nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits 2>/dev/null || sensors | grep -E 'edge|temp1' | awk '{print $2}' | head -1}
${alignr}────────────────────────────
${alignr}${color1}${font ConkySymbols:size=20}J${font Roboto Mono:size=10} Memory
${alignr}${color1}RAM${color} $mem/$memmax $memperc% ${membar 4,80}
${alignr}${color1}SWAP${color} $swap/$swapmax $swapperc% ${swapbar 4,80}
${alignr}────────────────────────────
${alignr}${color1}${font ConkySymbols:size=20}n${font Roboto Mono:size=10} Top Processes
${alignr}${color1}${top name 1}${color} ${top cpu 1}%
${alignr}${color1}${top name 2}${color} ${top cpu 2}%
${alignr}${color1}${top name 3}${color} ${top cpu 3}%
${alignr}────────────────────────────
${alignr}${color1}${font ConkySymbols:size=20}k${font Roboto Mono:size=10} Storage
${alignr}${color1}ROOT${color} ${fs_used /} / ${fs_size /} ${fs_used_perc /}%
${alignr}${fs_bar 5,150 /}
${alignr}────────────────────────────
${alignr}${color1}${font ConkySymbols:size=15}g${font Roboto Mono:size=10} Internet
${if_up ${gw_iface}}${alignr}${color1}Interface${color} ${gw_iface} ${addr ${gw_iface}}
${alignr}${color1}Down${color} ${downspeed ${gw_iface}} ${color1}Up${color} ${upspeed ${gw_iface}}
${else}${alignr}${color1}Not connected
${endif}${alignr}────────────────────────────
${alignr}${color1}${font ConkySymbols:size=15}i${font Roboto Mono:size=10} ${time %A}
${alignr}${time %d %B, %Y}
${alignr}${time %H:%M:%S}
]]
